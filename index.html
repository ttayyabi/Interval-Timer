<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Interval Timer</title>
  
  <!-- iOS Standalone Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">

  <!-- Embedded Minimalist Stopwatch App Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' fill='%231c1c1e' rx='40'/><circle cx='90' cy='95' r='45' fill='none' stroke='%2330d158' stroke-width='8'/><rect x='86' y='32' width='8' height='16' rx='4' fill='%2330d158'/><line x1='90' y1='95' x2='90' y2='68' stroke='%23ffffff' stroke-width='6' stroke-linecap='round'/></svg>">

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.15s ease;
    }

    /* Flash effect on transition */
    body.flash-transition {
      background-color: #30d158 !important;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin: 10px 0 20px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      color: #8e8e93;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus {
      border-color: #0a84ff;
    }

    .exercise-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2c2c2e;
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .delete-btn {
      background: #ff453a;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn {
      background: #30d158;
      color: #000;
      border: none;
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.1s ease;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-secondary {
      background: #0a84ff;
      color: #fff;
      font-size: 16px;
      padding: 12px;
      border-radius: 10px;
    }

    .btn-danger { background: #ff453a; color: #fff; }
    .btn-orange { background: #ff9f0a; color: #fff; }

    /* Timer Screen Layout */
    #timer-screen {
      display: none;
      text-align: center;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
    }

    .round-indicator {
      font-size: 22px;
      color: #8e8e93;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      margin-top: 8px;
      letter-spacing: 0.5px;
      background: rgba(48, 209, 88, 0.2);
      color: #30d158;
    }

    .exercise-title {
      font-size: 38px;
      font-weight: 900;
      text-transform: uppercase;
      margin: 15px 0 5px;
      line-height: 1.1;
      padding: 0 10px;
    }

    .timer-display {
      font-size: 120px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 10px 0;
    }

    .timer-warning {
      color: #ff453a;
    }

    .subtext {
      color: #8e8e93;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- CONFIGURATION VIEW -->
  <div id="config-screen">
    <h1>Interval Timer</h1>
    
    <div class="card">
      <label>Workout Settings</label>
      <div>
        <small style="color:#8e8e93;">Rounds</small>
        <input type="number" id="total-rounds" value="3" min="1">
      </div>
    </div>

    <div class="card">
      <label>Exercises</label>
      <div id="exercise-list"></div>
    </div>

    <div class="card">
      <label>Add New Exercise</label>
      <input type="text" id="new-name" placeholder="Exercise Name (e.g., Squats)">
      <input type="number" id="new-duration" value="30" placeholder="Duration (seconds)">
      <button class="btn btn-secondary" onclick="addExercise()">+ Add Exercise</button>
    </div>

    <button class="btn" onclick="startWorkout()">Start Workout</button>
  </div>

  <!-- ACTIVE TIMER VIEW -->
  <div id="timer-screen">
    <div>
      <div class="round-indicator" id="round-text">Round 1 of 3</div>
      <div class="badge" id="status-badge">EXERCISE 1/3</div>
    </div>

    <div>
      <div class="exercise-title" id="exercise-display">Push-ups</div>
      <div class="timer-display" id="time-display">30</div>
      <div class="subtext">SECONDS REMAINING</div>
    </div>

    <div>
      <button class="btn btn-orange" id="pause-btn" onclick="togglePause()">Pause</button>
      <button class="btn btn-danger" style="margin-top: 12px;" onclick="resetWorkout()">Stop Workout</button>
    </div>
  </div>

  <script>
    let defaultExercises = [
      { name: "Push-ups", duration: 30 },
      { name: "Plank", duration: 45 },
      { name: "Jumping Jacks", duration: 30 }
    ];

    let exercises = JSON.parse(localStorage.getItem('timer_exercises')) || defaultExercises;
    let totalRounds = parseInt(localStorage.getItem('timer_rounds')) || 3;

    let currentRound = 1;
    let currentIndex = 0;
    let timeRemaining = 0;
    let isPaused = false;
    let timerInterval = null;

    // Web Audio API setup for mobile compatibility
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Play a longer tone (approx 0.35s) for interval changes
    function playTransitionTone(freq = 880) {
      if (!audioCtx) return;
      initAudio();

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle'; // Richer tone than default sine
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        // Envelope: quick attack, sustained body, smooth decay over 0.35 seconds
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.exponentialRampToValueAtTime(0.8, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {
        console.warn('Audio play error:', e);
      }
    }

    function saveData() {
      localStorage.setItem('timer_exercises', JSON.stringify(exercises));
      localStorage.setItem('timer_rounds', document.getElementById('total-rounds').value);
    }

    function renderExercises() {
      const container = document.getElementById('exercise-list');
      container.innerHTML = '';
      exercises.forEach((ex, i) => {
        container.innerHTML += `
          <div class="exercise-item">
            <div>
              <strong style="font-size: 17px;">${ex.name}</strong><br>
              <small style="color: #8e8e93;">${ex.duration} seconds</small>
            </div>
            <button class="delete-btn" onclick="deleteExercise(${i})">Delete</button>
          </div>
        `;
      });
      document.getElementById('total-rounds').value = totalRounds;
    }

    function addExercise() {
      const nameInput = document.getElementById('new-name');
      const durationInput = document.getElementById('new-duration');
      const name = nameInput.value.trim();
      const duration = parseInt(durationInput.value);

      if (name && duration > 0) {
        exercises.push({ name, duration });
        nameInput.value = '';
        saveData();
        renderExercises();
      }
    }

    function deleteExercise(index) {
      exercises.splice(index, 1);
      saveData();
      renderExercises();
    }

    // Screen Flash Visual Cue
    function triggerScreenFlash() {
      document.body.classList.add('flash-transition');
      setTimeout(() => {
        document.body.classList.remove('flash-transition');
      }, 300);
    }

    function startWorkout() {
      if (exercises.length === 0) return;
      initAudio(); // Initialize audio context on initial user tap
      saveData();

      totalRounds = parseInt(document.getElementById('total-rounds').value) || 1;
      
      currentRound = 1;
      currentIndex = 0;
      timeRemaining = exercises[0].duration;

      document.getElementById('config-screen').style.display = 'none';
      document.getElementById('timer-screen').style.display = 'flex';
      
      updateTimerUI();
      runTimer();
    }

    function runTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isPaused) return;

        if (timeRemaining > 1) {
          timeRemaining--;
          updateTimerUI();
        } else {
          advanceTimer();
        }
      }, 1000);
    }

    function advanceTimer() {
      triggerScreenFlash();
      playTransitionTone(880); // High tone for transition

      if (currentIndex < exercises.length - 1) {
        currentIndex++;
        timeRemaining = exercises[currentIndex].duration;
      } else if (currentRound < totalRounds) {
        currentRound++;
        currentIndex = 0;
        timeRemaining = exercises[0].duration;
      } else {
        playTransitionTone(1046.5); // Final completion note
        setTimeout(() => alert("Workout Completed! Great Job!"), 100);
        resetWorkout();
        return;
      }

      updateTimerUI();
    }

    function updateTimerUI() {
      document.getElementById('round-text').innerText = `Round ${currentRound} of ${totalRounds}`;
      document.getElementById('status-badge').innerText = `EXERCISE ${currentIndex + 1}/${exercises.length}`;
      document.getElementById('exercise-display').innerText = exercises[currentIndex].name;

      const timeDisplay = document.getElementById('time-display');
      timeDisplay.innerText = timeRemaining;
      
      if (timeRemaining <= 5) {
        timeDisplay.classList.add('timer-warning');
      } else {
        timeDisplay.classList.remove('timer-warning');
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      document.getElementById('pause-btn').innerText = isPaused ? "Resume" : "Pause";
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isPaused = false;
      document.getElementById('pause-btn').innerText = "Pause";
      document.getElementById('config-screen').style.display = 'block';
      document.getElementById('timer-screen').style.display = 'none';
    }

    document.getElementById('total-rounds').addEventListener('change', saveData);

    renderExercises();
  </script>
</body>
</html>
